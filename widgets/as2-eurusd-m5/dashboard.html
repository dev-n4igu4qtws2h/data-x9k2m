<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>AS-2 EURUSD M5 Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-primary: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --color-win: #3fb950;
            --color-loss: #f85149;
            --color-neutral: #58a6ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .timeframe-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .timeframe-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .timeframe-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--color-neutral);
        }

        .timeframe-btn.active {
            background: var(--color-neutral);
            color: white;
            border-color: var(--color-neutral);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gauge-container {
            height: 250px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-primary);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .stat-value.white {
            color: var(--text-primary);
        }

        .stat-value.win {
            color: var(--color-win);
        }

        .stat-value.loss {
            color: var(--color-loss);
        }

        .chart-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .equity-card {
            grid-column: 1 / -1;
        }

        .equity-chart {
            height: 350px;
            margin-top: 15px;
        }

        .calendar-view {
            margin-top: 15px;
        }

        .calendar-grid {
            display: grid;
            gap: 4px;
            margin-top: 10px;
        }

        .calendar-week-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 8px;
            align-items: start;
        }

        .week-summary {
            background: var(--bg-secondary);
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .week-label {
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .week-days {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 4px;
        }

        .calendar-day {
            background: var(--bg-secondary);
            padding: 6px;
            border-radius: 4px;
            font-size: 10px;
            text-align: center;
            transition: all 0.2s;
        }

        .calendar-day.positive {
            background: rgba(63, 185, 80, 0.15);
        }

        .calendar-day.negative {
            background: rgba(248, 81, 73, 0.15);
        }

        .day-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 9px;
            margin-bottom: 2px;
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-primary);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .timeframe-buttons {
                gap: 8px;
            }
            
            .timeframe-btn {
                padding: 6px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AS-2 EURUSD M5</h1>
            <p>Live Trading Dashboard</p>
        </div>

        <div class="timeframe-buttons">
            <button class="timeframe-btn active" data-timeframe="overall">Max</button>
            <button class="timeframe-btn" data-timeframe="ytd">YTD</button>
            <button class="timeframe-btn" data-timeframe="this_month">This Month</button>
            <button class="timeframe-btn" data-timeframe="last_month">Last Month</button>
        </div>

        <div class="stats-grid">
            <div class="card">
                <div class="card-title">Winrate</div>
                <div class="gauge-container">
                    <div id="gaugeChart"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Statistics</div>
                <div class="stat-row">
                    <span class="stat-label">W:L</span>
                    <span class="stat-value" id="wlPerformance">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">PF</span>
                    <span class="stat-value" id="profitFactor">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">P&L</span>
                    <span class="stat-value" id="profit">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Drawdown</span>
                    <span class="stat-value" id="drawdown">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Max DD</span>
                    <span class="stat-value" id="maxDrawdown">-</span>
                </div>
            </div>

            <div class="card" id="signalAccuracyCard" style="display: none;">
                <div class="card-title">Misdeeds</div>
                <div class="stat-row">
                    <span class="stat-label">Your Stats</span>
                    <span class="stat-value" id="yourStats">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Reference Signal Service</span>
                    <span class="stat-value" id="refStats">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Datafeed Diff</span>
                    <span class="stat-value" id="datafeedDiff">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Misdeeds</span>
                    <span class="stat-value" id="missetaten">-</span>
                </div>
            </div>
        </div>

        <div class="card equity-card">
            <div class="card-title">Equity Curve</div>
            <div class="equity-chart">
                <div id="equityChart"></div>
            </div>
        </div>

        <div class="card equity-card">
            <div class="card-title">Calendar View</div>
            <div class="calendar-view">
                <div id="calendarContainer"></div>
            </div>
        </div>

        <div class="footer">
            <p>Last updated: <span id="lastUpdated">-</span></p>
            <p>Auto-refresh every 60 seconds</p>
        </div>
    </div>

    <script>
        let gaugeChart;
        let equityChart;
        let allData = null;
        let currentTimeframe = 'overall';

        // Initialize Gauge Chart
        function initGaugeChart() {
            const options = {
                series: [0],
                chart: {
                    type: 'radialBar',
                    height: 250,
                    background: 'transparent'
                },
                plotOptions: {
                    radialBar: {
                        startAngle: -135,
                        endAngle: 135,
                        hollow: {
                            size: '65%',
                        },
                        track: {
                            background: '#21262d',
                            strokeWidth: '100%',
                        },
                        dataLabels: {
                            name: {
                                fontSize: '14px',
                                color: '#8b949e',
                                offsetY: -10
                            },
                            value: {
                                fontSize: '32px',
                                color: '#c9d1d9',
                                offsetY: 5,
                                formatter: function(val) {
                                    return val.toFixed(1) + '%';
                                }
                            }
                        }
                    }
                },
                fill: {
                    type: 'gradient',
                    gradient: {
                        shade: 'dark',
                        type: 'horizontal',
                        shadeIntensity: 0.5,
                        gradientToColors: ['#3fb950'],
                        inverseColors: false,
                        opacityFrom: 1,
                        opacityTo: 1,
                        stops: [0, 100]
                    }
                },
                stroke: {
                    lineCap: 'round'
                },
                labels: ['Win Rate'],
                theme: {
                    mode: 'dark'
                }
            };

            gaugeChart = new ApexCharts(document.querySelector("#gaugeChart"), options);
            gaugeChart.render();
        }

        // Initialize Equity Chart
        function initEquityChart() {
            const options = {
                series: [
                    { name: 'Profit', data: [] },
                    { name: 'Loss', data: [] }
                ],
                chart: {
                    type: 'area',
                    height: 350,
                    background: 'transparent',
                    toolbar: {
                        show: false
                    },
                    zoom: {
                        enabled: false
                    }
                },
                stroke: {
                    curve: 'smooth',
                    width: 1.5,
                    colors: ['#3fb950', '#f85149']
                },
                fill: {
                    type: 'gradient',
                    gradient: {
                        shade: 'dark',
                        type: 'vertical',
                        shadeIntensity: 0.5,
                        inverseColors: false,
                        opacityFrom: 0.8,
                        opacityTo: 0.1,
                        stops: [0, 100]
                    }
                },
                colors: ['#3fb950', '#f85149'],
                markers: {
                    size: 0
                },
                dataLabels: {
                    enabled: false
                },
                xaxis: {
                    type: 'datetime',
                    labels: {
                        style: {
                            colors: '#8b949e',
                            fontSize: '12px'
                        },
                        datetimeUTC: false
                    },
                    axisBorder: {
                        color: '#30363d'
                    },
                    axisTicks: {
                        color: '#30363d'
                    }
                },
                yaxis: {
                    forceNiceScale: true,
                    labels: {
                        style: {
                            colors: '#8b949e',
                            fontSize: '12px'
                        },
                        formatter: function(val) {
                            return '€' + val.toFixed(0);
                        }
                    }
                },
                annotations: {
                    yaxis: [{
                        y: 0,
                        borderColor: '#30363d',
                        strokeDashArray: 0,
                        borderWidth: 2,
                        opacity: 0.5
                    }]
                },
                grid: {
                    borderColor: '#30363d',
                    strokeDashArray: 3,
                    xaxis: {
                        lines: {
                            show: true
                        }
                    },
                    yaxis: {
                        lines: {
                            show: true
                        }
                    }
                },
                tooltip: {
                    theme: 'dark',
                    x: {
                        format: 'dd MMM yyyy'
                    },
                    y: {
                        formatter: function(val) {
                            return '€' + val.toFixed(2);
                        }
                    }
                },
                legend: {
                    show: false
                },
                theme: {
                    mode: 'dark'
                }
            };

            equityChart = new ApexCharts(document.querySelector("#equityChart"), options);
            equityChart.render();
        }

        // Update Dashboard
        function updateDashboard(timeframe) {
            if (!allData || !allData[timeframe]) return;

            const data = allData[timeframe];
            const equity = allData.equity[timeframe];

            // Update gauge
            gaugeChart.updateSeries([data.winrate]);

            // Update stats
            // W:L: wins:losses | total trades
            const wlPerfElem = document.getElementById('wlPerformance');
            wlPerfElem.innerHTML = `<span style="color: var(--color-win)">${data.wins}</span><span style="color: var(--text-secondary)">:</span><span style="color: var(--color-loss)">${data.losses}</span><span style="color: var(--text-secondary)"> | ${data.total}T</span>`;

            // Profit Factor - Family Office 5-Tier Standard
            const profitFactorElem = document.getElementById('profitFactor');
            const pf = data.profit_factor || 0;

            let pfColor, pfText;
            if (pf < 1.0) {
                pfColor = '#f85149'; // 🔴 Red - LOSS
                pfText = pf.toFixed(2);
            } else if (pf < 1.3) {
                pfColor = '#ff8c00'; // 🟠 Orange - VIABLE
                pfText = pf.toFixed(2);
            } else if (pf < 1.5) {
                pfColor = '#e5a823'; // 🟡 Yellow - DECENT
                pfText = pf.toFixed(2);
            } else if (pf < 2.0) {
                pfColor = '#3fb950'; // 🟢 Green - FO-READY
                pfText = pf.toFixed(2);
            } else {
                pfColor = '#3fb950'; // ⭐ Green - ELITE
                pfText = '⭐ ' + pf.toFixed(2);
            }

            profitFactorElem.textContent = pfText;
            profitFactorElem.style.color = pfColor;
            profitFactorElem.className = 'stat-value';

            // Get profit for the timeframe
            let finalProfit;
            if (equity && equity.length > 0) {
                if (timeframe === 'overall' || timeframe === 'ytd') {
                    // For overall and YTD, show total profit (last equity value)
                    finalProfit = equity[equity.length - 1].equity;
                } else {
                    // For time periods, calculate profit earned during the period
                    // Since equity values are absolute cumulative, we need baseline before period
                    const overallEquity = allData.equity.overall;
                    const firstDateInPeriod = new Date(equity[0].date);
                    let baselineEquity = 0;

                    // Find last equity point before this period
                    for (let i = overallEquity.length - 1; i >= 0; i--) {
                        const pointDate = new Date(overallEquity[i].date);
                        if (pointDate < firstDateInPeriod) {
                            baselineEquity = overallEquity[i].equity;
                            break;
                        }
                    }

                    // Current equity minus equity before period = profit earned in period
                    finalProfit = equity[equity.length - 1].equity - baselineEquity;
                }
            } else {
                finalProfit = 0;
            }

            const totalDeposits = allData.total_deposits || 1; // Avoid division by zero
            // Use Time-Weighted Return % from backend
            const twrPercent = data.twr_percent || 0;
            const profitPercent = twrPercent.toFixed(1);

            const profitElem = document.getElementById('profit');
            const formattedProfit = Math.round(finalProfit).toLocaleString('de-DE');
            const profitPercentWithSign = (twrPercent >= 0 ? '+' : '') + profitPercent;
            profitElem.innerHTML = `${formattedProfit}€<span style="color: var(--text-secondary)"> | </span>${profitPercentWithSign}%`;
            profitElem.className = 'stat-value' + (finalProfit >= 0 ? ' win' : ' loss');

            // Calculate Drawdown: Peak (ATH up to timeframe end) - Last balance
            let peak = 0;
            let lastBalance = 0;

            if (equity && equity.length > 0) {
                equity.forEach(point => {
                    if (point.equity > peak) {
                        peak = point.equity;
                    }
                });
                // Last balance is the final equity value in timeframe
                lastBalance = equity[equity.length - 1].equity;
            }

            // DD = Peak - Last balance
            const currentDrawdown = peak - lastBalance;
            const currentDrawdownPercent = totalDeposits > 0
                ? ((currentDrawdown / totalDeposits) * 100).toFixed(1)
                : 0;

            const drawdownElem = document.getElementById('drawdown');
            if (currentDrawdown <= 0) {
                drawdownElem.innerHTML = '🏆 ATH';
                drawdownElem.className = 'stat-value win';
            } else {
                const formattedCurrentDrawdown = Math.round(currentDrawdown).toLocaleString('de-DE');
                drawdownElem.innerHTML = `${formattedCurrentDrawdown}€<span style="color: var(--text-secondary)"> | </span>${currentDrawdownPercent}%`;
                drawdownElem.className = 'stat-value loss';
            }

            // Calculate Max Drawdown with proper HWM tracking
            let maxDrawdown = 0;
            let maxDrawdownPercent = 0;
            let maxDdPeak = 0;

            if (equity && equity.length > 0) {
                equity.forEach(point => {
                    // Update peak (HWM) if current equity is higher
                    if (point.equity > maxDdPeak) {
                        maxDdPeak = point.equity;
                    }
                    // Calculate drawdown from peak
                    const drawdown = maxDdPeak - point.equity;
                    const drawdownPercent = totalDeposits > 0 ? (drawdown / totalDeposits) * 100 : 0;

                    // Track maximum drawdown
                    if (drawdown > maxDrawdown) {
                        maxDrawdown = drawdown;
                        maxDrawdownPercent = drawdownPercent;
                    }
                });
            }

            maxDrawdownPercent = maxDrawdownPercent.toFixed(1);
            const maxDrawdownElem = document.getElementById('maxDrawdown');
            const formattedDrawdown = Math.round(maxDrawdown).toLocaleString('de-DE');
            maxDrawdownElem.innerHTML = `${formattedDrawdown}€<span style="color: var(--text-secondary)"> | </span>${maxDrawdownPercent}%`;
            maxDrawdownElem.className = 'stat-value loss';

            // Update equity chart
            if (equity && equity.length > 0) {
                let aggregatedEquity;

                // Weekly aggregation for YTD and Overall, daily for shorter timeframes
                if (timeframe === 'overall' || timeframe === 'ytd') {
                    // Group by week (ISO week number)
                    const equityByWeek = {};
                    equity.forEach(point => {
                        const date = new Date(point.date);
                        const weekStart = new Date(date);
                        weekStart.setDate(date.getDate() - date.getDay() + 1); // Monday
                        const weekKey = weekStart.toISOString().split('T')[0];
                        equityByWeek[weekKey] = point.equity; // Last value of the week
                    });

                    aggregatedEquity = Object.entries(equityByWeek).map(([date, equity]) => ({
                        date: date,
                        equity: equity
                    }));
                } else {
                    // Daily aggregation for shorter timeframes
                    const equityByDay = {};
                    equity.forEach(point => {
                        equityByDay[point.date] = point.equity;
                    });

                    aggregatedEquity = Object.entries(equityByDay).map(([date, equity]) => ({
                        date: date,
                        equity: equity
                    }));
                }

                // Normalize to show relative performance (subtract first value for timeframe display)
                // Get the baseline: for non-overall timeframes, use the equity before the timeframe started
                let baseline = 0;
                if (timeframe !== 'overall' && aggregatedEquity.length > 0) {
                    // Find the last equity point before this timeframe
                    const firstDateInTimeframe = new Date(aggregatedEquity[0].date);
                    const overallEquity = allData.equity.overall;

                    // Find the last point before the timeframe
                    for (let i = overallEquity.length - 1; i >= 0; i--) {
                        const pointDate = new Date(overallEquity[i].date);
                        if (pointDate < firstDateInTimeframe) {
                            baseline = overallEquity[i].equity;
                            break;
                        }
                    }
                }

                // Add starting point at €0 (one day before first trade)
                const firstDate = new Date(aggregatedEquity[0].date);
                const startDate = new Date(firstDate.getTime() - 24 * 60 * 60 * 1000); // 1 day before

                const allPoints = [
                    { x: startDate.getTime(), y: 0 },
                    ...aggregatedEquity.map(point => ({
                        x: new Date(point.date).getTime(),
                        y: point.equity - baseline
                    }))
                ];

                // Split into positive and negative series with interpolated zero crossings
                const profitData = [];
                const lossData = [];

                for (let i = 0; i < allPoints.length; i++) {
                    const point = allPoints[i];
                    const nextPoint = i < allPoints.length - 1 ? allPoints[i + 1] : null;

                    if (point.y >= 0) {
                        profitData.push([point.x, point.y]);

                        // Check if next point crosses into negative
                        if (nextPoint && nextPoint.y < 0) {
                            // Interpolate zero crossing point
                            const ratio = Math.abs(point.y) / (Math.abs(point.y) + Math.abs(nextPoint.y));
                            const crossX = point.x + (nextPoint.x - point.x) * ratio;
                            profitData.push([crossX, 0]);
                            profitData.push([crossX, null]); // End profit segment
                            lossData.push([crossX, 0]); // Start loss segment
                        }
                    } else {
                        lossData.push([point.x, point.y]);

                        // Check if next point crosses into positive
                        if (nextPoint && nextPoint.y >= 0) {
                            // Interpolate zero crossing point
                            const ratio = Math.abs(point.y) / (Math.abs(point.y) + Math.abs(nextPoint.y));
                            const crossX = point.x + (nextPoint.x - point.x) * ratio;
                            lossData.push([crossX, 0]);
                            lossData.push([crossX, null]); // End loss segment
                            profitData.push([crossX, 0]); // Start new profit segment
                        }
                    }
                }

                equityChart.updateSeries([
                    { name: 'Profit', data: profitData },
                    { name: 'Loss', data: lossData }
                ]);
            } else {
                equityChart.updateSeries([
                    { name: 'Profit', data: [] },
                    { name: 'Loss', data: [] }
                ]);
            }

            // Update Signal Accuracy widget (only visible for last_month)
            const signalCard = document.getElementById('signalAccuracyCard');
            if (timeframe === 'last_month' && allData.signal_accuracy && allData.signal_accuracy.last_month) {
                signalCard.style.display = 'block';

                const ref = allData.signal_accuracy.last_month;

                // Your Stats
                document.getElementById('yourStats').textContent =
                    `${data.wins}W / ${data.losses}L`;

                // Reference Signal Service
                document.getElementById('refStats').textContent =
                    `${ref.reference_wins}W / ${ref.reference_losses}L`;

                // Datafeed Diff
                const diffElem = document.getElementById('datafeedDiff');
                diffElem.textContent = `${ref.datafeed_diff >= 0 ? '+' : ''}${ref.datafeed_diff}`;
                diffElem.style.color = ref.datafeed_diff >= 0 ? 'var(--color-win)' : 'var(--color-loss)';

                // Misdeeds (discrepancies from expected)
                const misdeeds = Math.abs(data.wins - ref.expected_wins) + Math.abs(data.losses - ref.expected_losses);
                const misdeedsElem = document.getElementById('missetaten');
                misdeedsElem.textContent = misdeeds.toString();
                misdeedsElem.style.color = misdeeds === 0 ? 'var(--color-win)' : 'var(--color-loss)';
            } else {
                signalCard.style.display = 'none';
            }

            // Update timestamp
            if (allData.last_updated) {
                const date = new Date(allData.last_updated);
                document.getElementById('lastUpdated').textContent = date.toLocaleString('de-DE');
            }

            // Generate Calendar View
            generateCalendarView(timeframe);
        }

        // Generate Calendar View based on timeframe
        function generateCalendarView(timeframe) {
            const container = document.getElementById('calendarContainer');
            if (!allData || !allData[timeframe]) {
                container.innerHTML = '';
                return;
            }

            // Get trades data - we need to fetch from notion data
            // For now, we'll need to calculate from equity curve
            // This is a simplified version - ideally we'd have trade-level data

            if (timeframe === 'overall' || timeframe === 'ytd') {
                // Monthly view
                container.innerHTML = generateMonthlyCalendar(timeframe);
            } else if (timeframe === 'this_month' || timeframe === 'last_month') {
                // Daily view grouped by KW
                container.innerHTML = generateDailyCalendar(timeframe);
            } else {
                container.innerHTML = '';
            }
        }

        // Generate monthly calendar for Max/YTD
        function generateMonthlyCalendar(timeframe) {
            const calendarData = allData.calendar[timeframe];
            if (!calendarData || !calendarData.monthly || calendarData.monthly.length === 0) {
                return '<div style="color: var(--text-secondary); font-size: 12px;">No data available</div>';
            }

            let html = '<div class="calendar-grid">';

            // For Max (overall), add yearly summaries first
            if (timeframe === 'overall') {
                const yearlyData = {};
                calendarData.monthly.forEach(month => {
                    const year = month.date.substring(0, 4);
                    if (!yearlyData[year]) {
                        yearlyData[year] = { wins: 0, losses: 0, profit: 0 };
                    }
                    yearlyData[year].wins += month.wins;
                    yearlyData[year].losses += month.losses;
                    yearlyData[year].profit += month.profit;
                });

                // Display yearly summaries
                Object.keys(yearlyData).sort().forEach(year => {
                    const data = yearlyData[year];
                    const colorClass = data.wins > data.losses ? 'positive' : (data.wins < data.losses ? 'negative' : '');
                    html += `
                        <div class="calendar-week-row" style="margin-bottom: 15px;">
                            <div class="week-summary">
                                <div class="week-label">${year}</div>
                                <div style="color: var(--color-win)">${data.wins}</div>
                                <div style="color: var(--color-loss)">${data.losses}</div>
                                <div style="margin-top: 4px;">${Math.round(data.profit).toLocaleString('de-DE')}€</div>
                            </div>
                            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 4px;">
                    `;

                    // Add months for this year
                    calendarData.monthly.filter(m => m.date.startsWith(year)).forEach(month => {
                        const monthName = new Date(month.date + '-01').toLocaleDateString('de-DE', { month: 'short', year: 'numeric' });
                        const colorClass = month.wins > month.losses ? 'positive' : (month.wins < month.losses ? 'negative' : '');
                        html += `
                            <div class="calendar-day ${colorClass}">
                                <div class="day-label">${monthName}</div>
                                <div style="color: var(--color-win); display: inline;">${month.wins}</div><span style="color: var(--text-secondary);">:</span><div style="color: var(--color-loss); display: inline;">${month.losses}</div>
                                <div style="margin-top: 2px; font-size: 9px;">${Math.round(month.profit).toLocaleString('de-DE')}€</div>
                            </div>
                        `;
                    });

                    html += '</div></div>';
                });
            } else {
                // YTD: just show months without yearly summary
                html += '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 4px;">';
                calendarData.monthly.forEach(month => {
                    const monthName = new Date(month.date + '-01').toLocaleDateString('de-DE', { month: 'short', year: 'numeric' });
                    const colorClass = month.wins > month.losses ? 'positive' : (month.wins < month.losses ? 'negative' : '');
                    html += `
                        <div class="calendar-day ${colorClass}">
                            <div class="day-label">${monthName}</div>
                            <div style="color: var(--color-win); display: inline;">${month.wins}</div><span style="color: var(--text-secondary);">:</span><div style="color: var(--color-loss); display: inline;">${month.losses}</div>
                            <div style="margin-top: 2px; font-size: 9px;">${Math.round(month.profit).toLocaleString('de-DE')}€</div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            html += '</div>';
            return html;
        }

        // Generate daily calendar for This Month/Last Month grouped by KW
        function generateDailyCalendar(timeframe) {
            const calendarData = allData.calendar[timeframe];
            if (!calendarData || !calendarData.daily || calendarData.daily.length === 0) {
                return '<div style="color: var(--text-secondary); font-size: 12px;">No data available</div>';
            }

            // Helper function to get ISO week number
            function getWeekNumber(dateStr) {
                const date = new Date(dateStr);
                const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
                const dayNum = d.getUTCDay() || 7;
                d.setUTCDate(d.getUTCDate() + 4 - dayNum);
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
                return `KW${weekNo}`;
            }

            // Group days by week
            const weeklyData = {};
            calendarData.daily.forEach(day => {
                const week = getWeekNumber(day.date);
                if (!weeklyData[week]) {
                    weeklyData[week] = {
                        wins: 0,
                        losses: 0,
                        profit: 0,
                        days: []
                    };
                }
                weeklyData[week].wins += day.wins;
                weeklyData[week].losses += day.losses;
                weeklyData[week].profit += day.profit;
                weeklyData[week].days.push(day);
            });

            let html = '<div class="calendar-grid">';

            // Display each week
            Object.keys(weeklyData).sort((a, b) => {
                const weekA = parseInt(a.replace('KW', ''));
                const weekB = parseInt(b.replace('KW', ''));
                return weekA - weekB;
            }).forEach(week => {
                const data = weeklyData[week];
                html += `
                    <div class="calendar-week-row">
                        <div class="week-summary">
                            <div class="week-label">${week}</div>
                            <div><span style="color: var(--color-win)">${data.wins}</span><span style="color: var(--text-secondary)">:</span><span style="color: var(--color-loss)">${data.losses}</span></div>
                            <div style="margin-top: 4px;">${Math.round(data.profit).toLocaleString('de-DE')}€</div>
                        </div>
                        <div class="week-days">
                `;

                // Display days in this week
                data.days.forEach(day => {
                    const date = new Date(day.date);
                    const dayName = date.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'numeric' });
                    const colorClass = day.wins > day.losses ? 'positive' : (day.wins < day.losses ? 'negative' : '');
                    html += `
                        <div class="calendar-day ${colorClass}">
                            <div class="day-label">${dayName}</div>
                            <div><span style="color: var(--color-win)">${day.wins}</span><span style="color: var(--text-secondary)">:</span><span style="color: var(--color-loss)">${day.losses}</span></div>
                        </div>
                    `;
                });

                html += '</div></div>';
            });

            html += '</div>';
            return html;
        }

        // Load data
        async function loadData() {
            try {
                const response = await fetch('../../data/as2-eurusd-m5.json?t=' + Date.now());
                allData = await response.json();
                updateDashboard(currentTimeframe);
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Timeframe button handlers
        document.querySelectorAll('.timeframe-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTimeframe = this.dataset.timeframe;
                updateDashboard(currentTimeframe);
            });
        });

        // Initialize
        initGaugeChart();
        initEquityChart();
        loadData();

        // Auto-refresh every 60 seconds
        setInterval(loadData, 60000);
    </script>
</body>
</html>
