<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>AS-2 EURUSD M5 Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-primary: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --color-win: #3fb950;
            --color-loss: #f85149;
            --color-neutral: #58a6ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .timeframe-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .timeframe-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .timeframe-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--color-neutral);
        }

        .timeframe-btn.active {
            background: var(--color-neutral);
            color: white;
            border-color: var(--color-neutral);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gauge-container {
            height: 250px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-primary);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .stat-value.white {
            color: var(--text-primary);
        }

        .stat-value.win {
            color: var(--color-win);
        }

        .stat-value.loss {
            color: var(--color-loss);
        }

        .chart-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .equity-card {
            grid-column: 1 / -1;
        }

        .equity-chart {
            height: 350px;
            margin-top: 15px;
        }

        .calendar-view {
            margin-top: 15px;
        }

        .calendar-grid {
            display: grid;
            gap: 0;
            margin-top: 10px;
            border: 1px solid var(--border-primary);
            border-radius: 6px;
            overflow: hidden;
        }

        .calendar-header {
            display: grid;
            background: var(--bg-tertiary);
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border-primary);
        }

        .calendar-header-daily {
            grid-template-columns: 140px repeat(7, 1fr);
        }

        .calendar-header-monthly {
            grid-template-columns: 140px repeat(auto-fit, minmax(120px, 1fr));
        }

        .calendar-header-cell {
            padding: 12px 8px;
            text-align: center;
            border-right: 1px solid #3d444d;
        }

        .calendar-header-cell:last-child {
            border-right: none;
        }

        .calendar-week-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            border-bottom: 1px solid #3d444d;
        }

        .calendar-week-row:last-child {
            border-bottom: none;
        }

        .week-summary {
            background: var(--bg-tertiary);
            padding: 12px;
            font-size: 12px;
            border-right: 1px solid #3d444d;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .week-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-size: 14px;
        }

        .week-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .calendar-months {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
        }

        .calendar-day {
            background: var(--bg-secondary);
            padding: 12px 8px;
            font-size: 11px;
            text-align: center;
            transition: all 0.2s;
            border-right: 1px solid #3d444d;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .calendar-day:nth-child(7n) {
            border-right: none;
        }

        .calendar-day.positive {
            background: rgba(63, 185, 80, 0.2);
        }

        .calendar-day.negative {
            background: rgba(248, 81, 73, 0.2);
        }

        .calendar-day.empty {
            background: var(--bg-tertiary);
            opacity: 0.5;
        }

        .day-label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 11px;
            margin-bottom: 4px;
        }

        .day-date-topright {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .day-wl {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            color: var(--text-primary);
        }

        @media (max-width: 1024px) {
            .calendar-header-daily {
                grid-template-columns: 100px repeat(7, 1fr);
            }

            .calendar-week-row {
                grid-template-columns: 100px 1fr;
            }

            .week-summary {
                padding: 8px;
                font-size: 10px;
            }

            .calendar-day {
                padding: 8px 4px;
                font-size: 10px;
                min-height: 60px;
            }
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-primary);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .timeframe-buttons {
                gap: 8px;
            }
            
            .timeframe-btn {
                padding: 6px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AS-2 EURUSD M5</h1>
            <p>Live Trading Dashboard</p>
        </div>

        <div class="timeframe-buttons">
            <button class="timeframe-btn" data-timeframe="overall">Max</button>
            <button class="timeframe-btn" data-timeframe="ytd">YTD</button>
            <button class="timeframe-btn" data-timeframe="this_month">This Month</button>
            <button class="timeframe-btn" data-timeframe="last_month">Last Month</button>
        </div>

        <div class="stats-grid">
            <div class="card">
                <div class="card-title">Winrate</div>
                <div class="gauge-container">
                    <div id="gaugeChart"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Statistics</div>
                <div class="stat-row">
                    <span class="stat-label">W:L</span>
                    <span class="stat-value" id="wlPerformance">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">PF</span>
                    <span class="stat-value" id="profitFactor">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">P&L</span>
                    <span class="stat-value" id="profit">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Drawdown</span>
                    <span class="stat-value" id="drawdown">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Max DD</span>
                    <span class="stat-value" id="maxDrawdown">-</span>
                </div>
            </div>

            <div class="card" id="signalAccuracyCard" style="display: none;">
                <div class="card-title">Misdeeds</div>
                <div class="stat-row">
                    <span class="stat-label">Your Stats</span>
                    <span class="stat-value" id="yourStats">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Reference Signal Service</span>
                    <span class="stat-value" id="refStats">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Datafeed Diff</span>
                    <span class="stat-value" id="datafeedDiff">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Misdeeds</span>
                    <span class="stat-value" id="missetaten">-</span>
                </div>
            </div>
        </div>

        <div class="card equity-card">
            <div class="card-title">Equity Curve</div>
            <div class="equity-chart">
                <div id="equityChart"></div>
            </div>
        </div>

        <div class="card equity-card" style="margin-top: 20px;">
            <div class="card-title">Calendar View</div>
            <div class="calendar-view">
                <div id="calendarContainer"></div>
            </div>
        </div>

        <div class="footer">
            <p>Last updated: <span id="lastUpdated">-</span></p>
            <p>Auto-refresh every 60 seconds</p>
        </div>
    </div>

    <script>
        let gaugeChart;
        let equityChart;
        let allData = null;

        // Read timeframe from URL hash or default to 'overall'
        function getInitialTimeframe() {
            const hash = window.location.hash.substring(1); // Remove '#'
            const validTimeframes = ['overall', 'ytd', 'this_month', 'last_month'];
            return validTimeframes.includes(hash) ? hash : 'overall';
        }

        let currentTimeframe = getInitialTimeframe();

        // Initialize Gauge Chart
        function initGaugeChart() {
            const options = {
                series: [0],
                chart: {
                    type: 'radialBar',
                    height: 250,
                    background: 'transparent'
                },
                plotOptions: {
                    radialBar: {
                        startAngle: -135,
                        endAngle: 135,
                        hollow: {
                            size: '65%',
                        },
                        track: {
                            background: '#21262d',
                            strokeWidth: '100%',
                        },
                        dataLabels: {
                            name: {
                                fontSize: '14px',
                                color: '#8b949e',
                                offsetY: -10
                            },
                            value: {
                                fontSize: '32px',
                                color: '#c9d1d9',
                                offsetY: 5,
                                formatter: function(val) {
                                    return val.toFixed(1) + '%';
                                }
                            }
                        }
                    }
                },
                fill: {
                    type: 'gradient',
                    gradient: {
                        shade: 'dark',
                        type: 'horizontal',
                        shadeIntensity: 0.5,
                        gradientToColors: ['#3fb950'],
                        inverseColors: false,
                        opacityFrom: 1,
                        opacityTo: 1,
                        stops: [0, 100]
                    }
                },
                stroke: {
                    lineCap: 'round'
                },
                labels: ['Win Rate'],
                theme: {
                    mode: 'dark'
                }
            };

            gaugeChart = new ApexCharts(document.querySelector("#gaugeChart"), options);
            gaugeChart.render();
        }

        // Initialize Equity Chart
        function initEquityChart() {
            const options = {
                series: [
                    { name: 'Profit', data: [] },
                    { name: 'Loss', data: [] }
                ],
                chart: {
                    type: 'area',
                    height: 350,
                    background: 'transparent',
                    toolbar: {
                        show: false
                    },
                    zoom: {
                        enabled: false
                    }
                },
                stroke: {
                    curve: 'smooth',
                    width: 1.5,
                    colors: ['#3fb950', '#f85149']
                },
                fill: {
                    type: 'gradient',
                    gradient: {
                        shade: 'dark',
                        type: 'vertical',
                        shadeIntensity: 0.5,
                        inverseColors: false,
                        opacityFrom: 0.8,
                        opacityTo: 0.1,
                        stops: [0, 100]
                    }
                },
                colors: ['#3fb950', '#f85149'],
                markers: {
                    size: 0
                },
                dataLabels: {
                    enabled: false
                },
                xaxis: {
                    type: 'datetime',
                    labels: {
                        style: {
                            colors: '#8b949e',
                            fontSize: '12px'
                        },
                        datetimeUTC: false
                    },
                    axisBorder: {
                        color: '#30363d'
                    },
                    axisTicks: {
                        color: '#30363d'
                    }
                },
                yaxis: {
                    forceNiceScale: true,
                    labels: {
                        style: {
                            colors: '#8b949e',
                            fontSize: '12px'
                        },
                        formatter: function(val) {
                            return '€' + val.toFixed(0);
                        }
                    }
                },
                annotations: {
                    yaxis: [{
                        y: 0,
                        borderColor: '#30363d',
                        strokeDashArray: 0,
                        borderWidth: 2,
                        opacity: 0.5
                    }]
                },
                grid: {
                    borderColor: '#30363d',
                    strokeDashArray: 3,
                    xaxis: {
                        lines: {
                            show: true
                        }
                    },
                    yaxis: {
                        lines: {
                            show: true
                        }
                    }
                },
                tooltip: {
                    theme: 'dark',
                    x: {
                        format: 'dd MMM yyyy'
                    },
                    y: {
                        formatter: function(val) {
                            return '€' + val.toFixed(2);
                        }
                    }
                },
                legend: {
                    show: false
                },
                theme: {
                    mode: 'dark'
                }
            };

            equityChart = new ApexCharts(document.querySelector("#equityChart"), options);
            equityChart.render();
        }

        // Update Dashboard
        function updateDashboard(timeframe) {
            if (!allData || !allData[timeframe]) return;

            const data = allData[timeframe];
            const equity = allData.equity[timeframe];

            // Update gauge
            gaugeChart.updateSeries([data.winrate]);

            // Update stats
            // W:L: wins:losses | total trades
            const wlPerfElem = document.getElementById('wlPerformance');
            wlPerfElem.innerHTML = `<span style="color: var(--color-win)">${data.wins}</span><span style="color: var(--text-secondary)">:</span><span style="color: var(--color-loss)">${data.losses}</span><span style="color: var(--text-secondary)"> | ${data.total}T</span>`;

            // Profit Factor - Family Office 5-Tier Standard
            const profitFactorElem = document.getElementById('profitFactor');
            const pf = data.profit_factor || 0;

            let pfColor, pfText;
            if (pf < 1.0) {
                pfColor = '#f85149'; // 🔴 Red - LOSS
                pfText = pf.toFixed(2);
            } else if (pf < 1.3) {
                pfColor = '#ff8c00'; // 🟠 Orange - VIABLE
                pfText = pf.toFixed(2);
            } else if (pf < 1.5) {
                pfColor = '#e5a823'; // 🟡 Yellow - DECENT
                pfText = pf.toFixed(2);
            } else if (pf < 2.0) {
                pfColor = '#3fb950'; // 🟢 Green - FO-READY
                pfText = pf.toFixed(2);
            } else {
                pfColor = '#3fb950'; // ⭐ Green - ELITE
                pfText = '⭐ ' + pf.toFixed(2);
            }

            profitFactorElem.textContent = pfText;
            profitFactorElem.style.color = pfColor;
            profitFactorElem.className = 'stat-value';

            // Get profit for the timeframe
            let finalProfit;
            if (equity && equity.length > 0) {
                if (timeframe === 'overall' || timeframe === 'ytd') {
                    // For overall and YTD, show total profit (last equity value)
                    finalProfit = equity[equity.length - 1].equity;
                } else {
                    // For time periods, calculate profit earned during the period
                    // Since equity values are absolute cumulative, we need baseline before period
                    const overallEquity = allData.equity.overall;
                    const firstDateInPeriod = new Date(equity[0].date);
                    let baselineEquity = 0;

                    // Find last equity point before this period
                    for (let i = overallEquity.length - 1; i >= 0; i--) {
                        const pointDate = new Date(overallEquity[i].date);
                        if (pointDate < firstDateInPeriod) {
                            baselineEquity = overallEquity[i].equity;
                            break;
                        }
                    }

                    // Current equity minus equity before period = profit earned in period
                    finalProfit = equity[equity.length - 1].equity - baselineEquity;
                }
            } else {
                finalProfit = 0;
            }

            const totalDeposits = allData.total_deposits || 1; // Avoid division by zero
            // Use Time-Weighted Return % from backend
            const twrPercent = data.twr_percent || 0;
            const profitPercent = twrPercent.toFixed(1);

            const profitElem = document.getElementById('profit');
            const formattedProfit = Math.round(finalProfit).toLocaleString('de-DE');
            const profitPercentWithSign = (twrPercent >= 0 ? '+' : '') + profitPercent;
            profitElem.innerHTML = `${formattedProfit}€<span style="color: var(--text-secondary)"> | </span>${profitPercentWithSign}%`;
            profitElem.className = 'stat-value' + (finalProfit >= 0 ? ' win' : ' loss');

            // Calculate Drawdown: Peak (ATH up to timeframe end) - Last balance
            let peak = 0;
            let lastBalance = 0;

            if (equity && equity.length > 0) {
                equity.forEach(point => {
                    if (point.equity > peak) {
                        peak = point.equity;
                    }
                });
                // Last balance is the final equity value in timeframe
                lastBalance = equity[equity.length - 1].equity;
            }

            // DD = Peak - Last balance
            const currentDrawdown = peak - lastBalance;
            const currentDrawdownPercent = totalDeposits > 0
                ? ((currentDrawdown / totalDeposits) * 100).toFixed(1)
                : 0;

            const drawdownElem = document.getElementById('drawdown');
            if (currentDrawdown <= 0) {
                drawdownElem.innerHTML = '🏆 ATH';
                drawdownElem.className = 'stat-value win';
            } else {
                const formattedCurrentDrawdown = Math.round(currentDrawdown).toLocaleString('de-DE');
                drawdownElem.innerHTML = `${formattedCurrentDrawdown}€<span style="color: var(--text-secondary)"> | </span>${currentDrawdownPercent}%`;
                drawdownElem.className = 'stat-value loss';
            }

            // Calculate Max Drawdown with proper HWM tracking
            let maxDrawdown = 0;
            let maxDrawdownPercent = 0;
            let maxDdPeak = 0;

            if (equity && equity.length > 0) {
                equity.forEach(point => {
                    // Update peak (HWM) if current equity is higher
                    if (point.equity > maxDdPeak) {
                        maxDdPeak = point.equity;
                    }
                    // Calculate drawdown from peak
                    const drawdown = maxDdPeak - point.equity;
                    const drawdownPercent = totalDeposits > 0 ? (drawdown / totalDeposits) * 100 : 0;

                    // Track maximum drawdown
                    if (drawdown > maxDrawdown) {
                        maxDrawdown = drawdown;
                        maxDrawdownPercent = drawdownPercent;
                    }
                });
            }

            maxDrawdownPercent = maxDrawdownPercent.toFixed(1);
            const maxDrawdownElem = document.getElementById('maxDrawdown');
            const formattedDrawdown = Math.round(maxDrawdown).toLocaleString('de-DE');
            maxDrawdownElem.innerHTML = `${formattedDrawdown}€<span style="color: var(--text-secondary)"> | </span>${maxDrawdownPercent}%`;
            maxDrawdownElem.className = 'stat-value loss';

            // Update equity chart
            if (equity && equity.length > 0) {
                let aggregatedEquity;

                // Weekly aggregation for YTD and Overall, daily for shorter timeframes
                if (timeframe === 'overall' || timeframe === 'ytd') {
                    // Group by week (ISO week number)
                    const equityByWeek = {};
                    equity.forEach(point => {
                        const date = new Date(point.date);
                        const weekStart = new Date(date);
                        weekStart.setDate(date.getDate() - date.getDay() + 1); // Monday
                        const weekKey = weekStart.toISOString().split('T')[0];
                        equityByWeek[weekKey] = point.equity; // Last value of the week
                    });

                    aggregatedEquity = Object.entries(equityByWeek).map(([date, equity]) => ({
                        date: date,
                        equity: equity
                    }));
                } else {
                    // Daily aggregation for shorter timeframes
                    const equityByDay = {};
                    equity.forEach(point => {
                        equityByDay[point.date] = point.equity;
                    });

                    aggregatedEquity = Object.entries(equityByDay).map(([date, equity]) => ({
                        date: date,
                        equity: equity
                    }));
                }

                // Normalize to show relative performance (subtract first value for timeframe display)
                // Get the baseline: for non-overall timeframes, use the equity before the timeframe started
                let baseline = 0;
                if (timeframe !== 'overall' && aggregatedEquity.length > 0) {
                    // Find the last equity point before this timeframe
                    const firstDateInTimeframe = new Date(aggregatedEquity[0].date);
                    const overallEquity = allData.equity.overall;

                    // Find the last point before the timeframe
                    for (let i = overallEquity.length - 1; i >= 0; i--) {
                        const pointDate = new Date(overallEquity[i].date);
                        if (pointDate < firstDateInTimeframe) {
                            baseline = overallEquity[i].equity;
                            break;
                        }
                    }
                }

                // Add starting point at €0 (one day before first trade)
                const firstDate = new Date(aggregatedEquity[0].date);
                const startDate = new Date(firstDate.getTime() - 24 * 60 * 60 * 1000); // 1 day before

                const allPoints = [
                    { x: startDate.getTime(), y: 0 },
                    ...aggregatedEquity.map(point => ({
                        x: new Date(point.date).getTime(),
                        y: point.equity - baseline
                    }))
                ];

                // Split into positive and negative series with interpolated zero crossings
                const profitData = [];
                const lossData = [];

                for (let i = 0; i < allPoints.length; i++) {
                    const point = allPoints[i];
                    const nextPoint = i < allPoints.length - 1 ? allPoints[i + 1] : null;

                    if (point.y >= 0) {
                        profitData.push([point.x, point.y]);

                        // Check if next point crosses into negative
                        if (nextPoint && nextPoint.y < 0) {
                            // Interpolate zero crossing point
                            const ratio = Math.abs(point.y) / (Math.abs(point.y) + Math.abs(nextPoint.y));
                            const crossX = point.x + (nextPoint.x - point.x) * ratio;
                            profitData.push([crossX, 0]);
                            profitData.push([crossX, null]); // End profit segment
                            lossData.push([crossX, 0]); // Start loss segment
                        }
                    } else {
                        lossData.push([point.x, point.y]);

                        // Check if next point crosses into positive
                        if (nextPoint && nextPoint.y >= 0) {
                            // Interpolate zero crossing point
                            const ratio = Math.abs(point.y) / (Math.abs(point.y) + Math.abs(nextPoint.y));
                            const crossX = point.x + (nextPoint.x - point.x) * ratio;
                            lossData.push([crossX, 0]);
                            lossData.push([crossX, null]); // End loss segment
                            profitData.push([crossX, 0]); // Start new profit segment
                        }
                    }
                }

                equityChart.updateSeries([
                    { name: 'Profit', data: profitData },
                    { name: 'Loss', data: lossData }
                ]);
            } else {
                equityChart.updateSeries([
                    { name: 'Profit', data: [] },
                    { name: 'Loss', data: [] }
                ]);
            }

            // Update Signal Accuracy widget (only visible for last_month)
            const signalCard = document.getElementById('signalAccuracyCard');
            if (timeframe === 'last_month' && allData.signal_accuracy && allData.signal_accuracy.last_month) {
                signalCard.style.display = 'block';

                const ref = allData.signal_accuracy.last_month;

                // Your Stats
                document.getElementById('yourStats').textContent =
                    `${data.wins}W / ${data.losses}L`;

                // Reference Signal Service
                document.getElementById('refStats').textContent =
                    `${ref.reference_wins}W / ${ref.reference_losses}L`;

                // Datafeed Diff
                const diffElem = document.getElementById('datafeedDiff');
                diffElem.textContent = `${ref.datafeed_diff >= 0 ? '+' : ''}${ref.datafeed_diff}`;
                diffElem.style.color = ref.datafeed_diff >= 0 ? 'var(--color-win)' : 'var(--color-loss)';

                // Misdeeds (discrepancies from expected)
                const misdeeds = Math.abs(data.wins - ref.expected_wins) + Math.abs(data.losses - ref.expected_losses);
                const misdeedsElem = document.getElementById('missetaten');
                misdeedsElem.textContent = misdeeds.toString();
                misdeedsElem.style.color = misdeeds === 0 ? 'var(--color-win)' : 'var(--color-loss)';
            } else {
                signalCard.style.display = 'none';
            }

            // Update timestamp
            if (allData.last_updated) {
                const date = new Date(allData.last_updated);
                document.getElementById('lastUpdated').textContent = date.toLocaleString('de-DE');
            }

            // Generate Calendar View
            generateCalendarView(timeframe);
        }

        // Generate Calendar View based on timeframe
        function generateCalendarView(timeframe) {
            const container = document.getElementById('calendarContainer');
            if (!allData || !allData[timeframe]) {
                container.innerHTML = '';
                return;
            }

            // Get trades data - we need to fetch from notion data
            // For now, we'll need to calculate from equity curve
            // This is a simplified version - ideally we'd have trade-level data

            if (timeframe === 'overall' || timeframe === 'ytd') {
                // Monthly view
                container.innerHTML = generateMonthlyCalendar(timeframe);
            } else if (timeframe === 'this_month' || timeframe === 'last_month') {
                // Daily view grouped by KW
                container.innerHTML = generateDailyCalendar(timeframe);
            } else {
                container.innerHTML = '';
            }
        }

        // Generate monthly calendar for Max/YTD
        function generateMonthlyCalendar(timeframe) {
            const calendarData = allData.calendar[timeframe];
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                               'July', 'August', 'September', 'October', 'November', 'December'];

            // Create a map of existing trade data
            const tradeDataMap = {};
            if (calendarData && calendarData.monthly) {
                calendarData.monthly.forEach(month => {
                    tradeDataMap[month.date] = month;
                });
            }

            // For Max (overall), add yearly summaries first
            if (timeframe === 'overall') {
                // Determine all years that have data
                const years = new Set();
                if (calendarData && calendarData.monthly) {
                    calendarData.monthly.forEach(month => {
                        years.add(month.date.substring(0, 4));
                    });
                }

                const yearlyData = {};
                Array.from(years).sort().forEach(year => {
                    yearlyData[year] = { wins: 0, losses: 0, profit: 0, months: [] };

                    // Generate all 12 months for this year
                    for (let m = 1; m <= 12; m++) {
                        const monthKey = `${year}-${m.toString().padStart(2, '0')}`;
                        const monthData = tradeDataMap[monthKey];
                        const monthObj = {
                            date: monthKey,
                            wins: monthData ? monthData.wins : 0,
                            losses: monthData ? monthData.losses : 0,
                            profit: monthData ? monthData.profit : 0
                        };
                        yearlyData[year].months.push(monthObj);
                        yearlyData[year].wins += monthObj.wins;
                        yearlyData[year].losses += monthObj.losses;
                        yearlyData[year].profit += monthObj.profit;
                    }
                });

                let html = '<div class="calendar-grid">';

                // Add header with month names
                html += '<div class="calendar-header calendar-header-monthly">';
                html += '<div class="calendar-header-cell">Year</div>';
                monthNames.forEach(month => {
                    html += `<div class="calendar-header-cell">${month.substring(0, 3)}</div>`;
                });
                html += '</div>';

                // Display yearly summaries
                Object.keys(yearlyData).sort().forEach(year => {
                    const data = yearlyData[year];
                    html += `
                        <div class="calendar-week-row">
                            <div class="week-summary">
                                <div class="week-label">${year}</div>
                                <div class="day-wl">${data.wins}:${data.losses}</div>
                                <div style="margin-top: 4px;">${Math.round(data.profit).toLocaleString('de-DE')}€</div>
                            </div>
                            <div class="calendar-months">
                    `;

                    // Add all 12 months
                    data.months.forEach(month => {
                        const colorClass = month.wins > month.losses ? 'positive' : (month.wins < month.losses ? 'negative' : (month.wins === 0 && month.losses === 0 ? 'empty' : ''));
                        html += `
                            <div class="calendar-day ${colorClass}">
                                <div class="day-wl">${month.wins}:${month.losses}</div>
                                ${month.profit !== 0 ? `<div style="margin-top: 4px; font-size: 9px;">${Math.round(month.profit).toLocaleString('de-DE')}€</div>` : ''}
                            </div>
                        `;
                    });

                    html += '</div></div>';
                });

                html += '</div>';
                return html;
            } else {
                // YTD: just show months of current year
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth() + 1;

                // Generate all months for current year up to now
                const allMonths = [];
                for (let m = 1; m <= currentMonth; m++) {
                    const monthKey = `${currentYear}-${m.toString().padStart(2, '0')}`;
                    const monthData = tradeDataMap[monthKey];
                    allMonths.push({
                        date: monthKey,
                        wins: monthData ? monthData.wins : 0,
                        losses: monthData ? monthData.losses : 0,
                        profit: monthData ? monthData.profit : 0
                    });
                }

                let html = '<div class="calendar-grid">';

                // Add header with month names for YTD
                html += '<div class="calendar-header calendar-header-monthly">';
                html += '<div class="calendar-header-cell">YTD</div>';
                for (let m = 1; m <= currentMonth; m++) {
                    html += `<div class="calendar-header-cell">${monthNames[m - 1].substring(0, 3)}</div>`;
                }
                html += '</div>';

                // Single row for YTD
                const ytdTotals = allMonths.reduce((acc, m) => ({
                    wins: acc.wins + m.wins,
                    losses: acc.losses + m.losses,
                    profit: acc.profit + m.profit
                }), { wins: 0, losses: 0, profit: 0 });

                html += `
                    <div class="calendar-week-row">
                        <div class="week-summary">
                            <div class="week-label">${currentYear}</div>
                            <div class="day-wl">${ytdTotals.wins}:${ytdTotals.losses}</div>
                            <div style="margin-top: 4px;">${Math.round(ytdTotals.profit).toLocaleString('de-DE')}€</div>
                        </div>
                        <div class="calendar-months">
                `;

                allMonths.forEach(month => {
                    const colorClass = month.wins > month.losses ? 'positive' : (month.wins < month.losses ? 'negative' : (month.wins === 0 && month.losses === 0 ? 'empty' : ''));
                    html += `
                        <div class="calendar-day ${colorClass}">
                            <div class="day-wl">${month.wins}:${month.losses}</div>
                            ${month.profit !== 0 ? `<div style="margin-top: 4px; font-size: 9px;">${Math.round(month.profit).toLocaleString('de-DE')}€</div>` : ''}
                        </div>
                    `;
                });

                html += '</div></div></div>';
                return html;
            }
        }

        // Generate daily calendar for This Month/Last Month grouped by KW
        function generateDailyCalendar(timeframe) {
            const calendarData = allData.calendar[timeframe];

            // Determine ORIGINAL date range (without extension)
            const now = new Date();
            let originalStartDate, originalEndDate;

            if (timeframe === 'this_month') {
                originalStartDate = new Date(now.getFullYear(), now.getMonth(), 1);
                originalEndDate = new Date(now);
            } else if (timeframe === 'last_month') {
                originalStartDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                originalEndDate = new Date(now.getFullYear(), now.getMonth(), 0);
            }

            // Helper function to get ISO week number
            function getWeekNumber(date) {
                const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
                const dayNum = d.getUTCDay() || 7;
                d.setUTCDate(d.getUTCDate() + 4 - dayNum);
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
                return `KW${weekNo}`;
            }

            // Helper to get Monday of the week
            function getMondayOfWeek(date) {
                const d = new Date(date);
                const day = d.getDay() || 7; // Convert Sunday (0) to 7
                d.setDate(d.getDate() - (day - 1)); // Go back to Monday
                d.setHours(0, 0, 0, 0); // Reset time to avoid timezone issues
                return d;
            }

            // Helper to format date as YYYY-MM-DD without timezone conversion
            function formatDateString(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            // Create a map of ALL trade data (not just timeframe-specific)
            const tradeDataMap = {};
            if (allData.calendar && allData.calendar.overall && allData.calendar.overall.daily) {
                allData.calendar.overall.daily.forEach(day => {
                    tradeDataMap[day.date] = day;
                });
            }

            // First pass: Find which weeks have WEEKDAYS (Mon-Fri) in the original timeframe
            const weeksToInclude = new Set();
            const currentDate = new Date(originalStartDate);
            while (currentDate <= originalEndDate) {
                const dayOfWeek = currentDate.getDay(); // 0=Sunday, 6=Saturday
                // Only include weeks that have at least one weekday (Mon-Fri) in the timeframe
                if (dayOfWeek !== 0 && dayOfWeek !== 6) { // Not Saturday or Sunday
                    const week = getWeekNumber(currentDate);
                    weeksToInclude.add(week);
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }

            // Second pass: For each included week, generate all 7 days
            const weeklyData = {};
            weeksToInclude.forEach(week => {
                // Find any day in this week from the original range
                const tempDate = new Date(originalStartDate);
                let sampleDate = null;
                while (tempDate <= originalEndDate) {
                    if (getWeekNumber(tempDate) === week) {
                        sampleDate = new Date(tempDate);
                        break;
                    }
                    tempDate.setDate(tempDate.getDate() + 1);
                }

                if (!sampleDate) return;

                // Get Monday of this week
                const monday = getMondayOfWeek(sampleDate);

                // Generate all 7 days of this week
                const weekDays = [];
                for (let i = 0; i < 7; i++) {
                    const dayDate = new Date(monday);
                    dayDate.setDate(monday.getDate() + i);
                    const dateStr = formatDateString(dayDate);
                    const tradeData = tradeDataMap[dateStr];
                    weekDays.push({
                        date: dateStr,
                        wins: tradeData ? tradeData.wins : 0,
                        losses: tradeData ? tradeData.losses : 0,
                        profit: tradeData ? tradeData.profit : 0
                    });
                }

                // Calculate week totals
                const weekTotals = weekDays.reduce((acc, day) => ({
                    wins: acc.wins + day.wins,
                    losses: acc.losses + day.losses,
                    profit: acc.profit + day.profit
                }), { wins: 0, losses: 0, profit: 0 });

                weeklyData[week] = {
                    wins: weekTotals.wins,
                    losses: weekTotals.losses,
                    profit: weekTotals.profit,
                    days: weekDays
                };
            });

            // Add header with day names
            let html = '<div class="calendar-grid">';
            html += '<div class="calendar-header calendar-header-daily">';
            html += '<div class="calendar-header-cell">Week</div>';
            ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'].forEach(day => {
                html += `<div class="calendar-header-cell">${day}</div>`;
            });
            html += '</div>';

            // Display each week
            Object.keys(weeklyData).sort((a, b) => {
                const weekA = parseInt(a.replace('KW', ''));
                const weekB = parseInt(b.replace('KW', ''));
                return weekA - weekB;
            }).forEach(week => {
                const data = weeklyData[week];

                html += `
                    <div class="calendar-week-row">
                        <div class="week-summary">
                            <div class="week-label">${week}</div>
                            <div class="day-wl">${data.wins}:${data.losses}</div>
                            <div style="margin-top: 4px;">${Math.round(data.profit).toLocaleString('de-DE')}€</div>
                        </div>
                        <div class="week-days">
                `;

                // Display all 7 days (already in correct Mon-Sun order)
                data.days.forEach((day, index) => {
                    const date = new Date(day.date);
                    const dayNum = date.getDate();
                    const hasData = day.wins > 0 || day.losses > 0;
                    const colorClass = day.wins > day.losses ? 'positive' : (day.wins < day.losses ? 'negative' : '');

                    html += `
                        <div class="calendar-day ${colorClass}${!hasData ? ' empty' : ''}">
                            <div class="day-date-topright">${dayNum}</div>
                            ${hasData ? `<div class="day-wl">${day.wins}:${day.losses}</div>` : ''}
                        </div>
                    `;
                });

                html += '</div></div>';
            });

            html += '</div>';
            return html;
        }

        // Load data
        async function loadData() {
            try {
                const response = await fetch('../../data/as2-eurusd-m5.json?t=' + Date.now());
                allData = await response.json();
                updateDashboard(currentTimeframe);
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Timeframe button handlers
        document.querySelectorAll('.timeframe-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTimeframe = this.dataset.timeframe;

                // Update URL hash to save timeframe
                window.location.hash = currentTimeframe;

                updateDashboard(currentTimeframe);
            });
        });

        // Set active button based on initial timeframe
        function setActiveButton(timeframe) {
            document.querySelectorAll('.timeframe-btn').forEach(btn => {
                if (btn.dataset.timeframe === timeframe) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Initialize
        initGaugeChart();
        initEquityChart();
        setActiveButton(currentTimeframe); // Set correct active button from URL hash
        loadData();

        // Auto-refresh every 60 seconds
        setInterval(loadData, 60000);
    </script>
